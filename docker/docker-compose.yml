services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: langchain-rag-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: chenjiang
      POSTGRES_DB: langchain_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch —— 词法检索路（BM25 + 中文分词）
  # 替代 PG 内手写 BM25 SQL：倒排索引、打分、分词全部交给 ES
  # 官方 8.13.4 + smartcn 中文分析插件（见 docker/es/Dockerfile）
  elasticsearch:
    build:
      context: es
      dockerfile: Dockerfile
    container_name: langchain-rag-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: langchain-rag-backend
    environment:
      DATABASE_URL: postgresql://root:chenjiang@postgres:5432/langchain_rag
      ES_URL: http://elasticsearch:9200
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      PORT: 3001
      # 其余配置从 .env 注入（或在部署平台配 secret）
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY}
      IMAGE_VLM_PROVIDER: ${IMAGE_VLM_PROVIDER}
      IMAGE_VLM_API_KEY: ${IMAGE_VLM_API_KEY}
      IMAGE_VLM_MODEL: ${IMAGE_VLM_MODEL}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        # 容器内后端地址是服务名 backend，不是 localhost（rewrites 在 build 时写死）
        BACKEND_URL: http://backend:3001
    container_name: langchain-rag-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
